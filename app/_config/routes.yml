---
Name: approutes
After:
  - '#rootroutes'
  - '#coreroutes'
---
SilverStripe\Control\Director:
  rules:
    '': 'App\Controller\TouchPanelSplashController'
    'panel/splash//$Action/$ID': 'App\Controller\TouchPanelSplashController'
    'panel/pin//$Action/$ID': 'App\Controller\PanelAuthController'
    'panel/unlock//$Action/$ID': 'App\Controller\PanelAuthController'
    'panel/lock//$Action/$ID': 'App\Controller\PanelAuthController'
    'panel/discover//$Action/$ID': 'App\Controller\PanelAuthController'
    'panel/no-modules//$Action/$ID': 'App\Controller\PanelAuthController'
    'panel-update//$Action': 'App\Controller\SystemUpdateController'
    'panel//$Action/$ID': 'App\Controller\TouchPanelSplashController'
